name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-Beta.[0-9]*'

permissions:
  contents: read

jobs:
  # ── 1. Validate ────────────────────────────────────────────────────────────
  # Reject tags that don't match N.N.N exactly and tags whose commit is not
  # reachable from master.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-Beta\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match required format N.N.N or N.N.N-Beta.N."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch master and all tags
        run: git fetch origin master --tags

      - name: Verify tag commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag commit $GITHUB_SHA is not an ancestor of origin/master."
            exit 1
          fi

  # ── 2. Test ────────────────────────────────────────────────────────────────
  # All unit tests must pass before any artifact is built or released.
  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # The solution includes the MAUI app project (net10.0-android on Linux),
      # so the Android MAUI workload is required for solution restore to succeed.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # - name: Run tests
      #  run: dotnet test --configuration Release --blame-hang --blame-hang-timeout 2m

  # ── 3. Build – Windows ────────────────────────────────────────────────────
  # Produces:
  #   • BlinkTalk-windows.msi — WiX installer wrapping the self-contained
  #     (unpackaged) build. No code-signing certificate required.
  build-windows:
    needs: test
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Compute app versions
        shell: bash
        run: |
          VERSION_CORE="${VERSION%%-Beta.*}"
          echo "DISPLAY_VERSION=$VERSION_CORE" >> "$GITHUB_ENV"
          IFS='.' read -ra P <<< "$VERSION_CORE"
          echo "VERSION_CODE=$((${P[0]} * 10000 + ${P[1]} * 100 + ${P[2]}))" >> "$GITHUB_ENV"

      - name: Build portable (self-contained)
        shell: bash
        run: |
          dotnet publish Source/BlinkTalk/BlinkTalk.csproj \
            -f net10.0-windows10.0.19041.0 \
            -p:WindowsPublish=true \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:ApplicationDisplayVersion="$DISPLAY_VERSION" \
            -p:ApplicationVersion="$VERSION_CODE" \
            -p:WindowsPackageType=None \
            -o publish/portable

      - name: Build MSI installer
        shell: bash
        run: |
          dotnet build Source/Installer/BlinkTalk.wixproj \
            -c Release \
            -p:ProductVersion="$DISPLAY_VERSION" \
            -p:AppPublishDir="$PWD/publish/portable" \
            -o publish/installer
          cp publish/installer/BlinkTalk-Setup.msi "BlinkTalk-windows.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: BlinkTalk-windows.msi

  # ── 4. Build – Android ────────────────────────────────────────────────────
  # Produces:
  #   • BlinkTalk-android.apk — APK (signed when secrets are set)
  #   • BlinkTalk-GooglePlayStore.aab — App Bundle (signed when secrets are set)
  #
  # Required secrets (the job fails if any are absent — otherwise MAUI silently
  # signs with a debug key, which Google Play rejects):
  #   ANDROID_KEYSTORE          – Base64-encoded JKS/PKCS12 keystore.
  #   ANDROID_KEYSTORE_PASSWORD – Keystore password.
  #   ANDROID_KEY_ALIAS         – Key alias inside the keystore.
  #   ANDROID_KEY_PASSWORD      – Key password.
  build-android:
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Compute app versions
        run: |
          VERSION_CORE="${VERSION%%-Beta.*}"
          echo "DISPLAY_VERSION=$VERSION_CORE" >> "$GITHUB_ENV"
          IFS='.' read -ra P <<< "$VERSION_CORE"
          echo "VERSION_CODE=$((${P[0]} * 10000 + ${P[1]} * 100 + ${P[2]}))" >> "$GITHUB_ENV"

      - name: Verify signing secrets
        run: |
          MISSING=""
          [ -z "$KEYSTORE_B64" ]    && MISSING="$MISSING ANDROID_KEYSTORE"
          [ -z "$STORE_PASSWORD" ]  && MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]       && MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]    && MISSING="$MISSING ANDROID_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secret(s):$MISSING. Without them the packages are signed with a debug key, which Google Play rejects. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          if [ ! -s "$RUNNER_TEMP/keystore.jks" ]; then
            echo "::error::Decoded keystore is empty – check the ANDROID_KEYSTORE secret is valid base64."
            exit 1
          fi

      - name: Build Android packages
        run: |
          PUBLISH_ARGS=(
            "Source/BlinkTalk/BlinkTalk.csproj"
            "-f" "net10.0-android"
            "-c" "Release"
            "-p:ApplicationDisplayVersion=$DISPLAY_VERSION"
            "-p:ApplicationVersion=$VERSION_CODE"
            # MSBuild treats a raw ';' here as a switch separator on Unix, so encode it.
            "-p:AndroidPackageFormats=apk%3Baab"
            "-p:AndroidKeyStore=true"
            "-p:AndroidSigningKeyStore=$RUNNER_TEMP/keystore.jks"
            "-p:AndroidSigningKeyAlias=$KEY_ALIAS"
            "-p:AndroidSigningKeyPass=$KEY_PASSWORD"
            "-p:AndroidSigningStorePass=$STORE_PASSWORD"
            "-o" "publish/android"
          )
          dotnet publish "${PUBLISH_ARGS[@]}"

      - name: Rename Android packages
        run: |
          PACKAGE_DIRS="publish/android Source/BlinkTalk/bin/Release/net10.0-android"

          # MAUI emits both an unsigned "*.apk" and the installable signed APK.
          # Prefer a signed package regardless of filename casing or exact suffix.
          APK=$(find $PACKAGE_DIRS -type f \( -iname "*-signed.apk" -o -iname "*signed*.apk" \) | head -1)
          if [ -z "$APK" ]; then
            APK=$(find $PACKAGE_DIRS -type f -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK found in $PACKAGE_DIRS."
            exit 1
          fi
          cp "$APK" "BlinkTalk-android.apk"

          AAB=$(find $PACKAGE_DIRS -type f -iname "*-signed.aab" | head -1)
          if [ -z "$AAB" ]; then
            AAB=$(find $PACKAGE_DIRS -type f -name "*.aab" | head -1)
          fi
          if [ -z "$AAB" ]; then
            echo "::error::No AAB found in $PACKAGE_DIRS."
            exit 1
          fi
          cp "$AAB" "BlinkTalk-GooglePlayStore.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            BlinkTalk-android.apk
            BlinkTalk-GooglePlayStore.aab

  # ── 5. Build – macOS ──────────────────────────────────────────────────────
  # Produces:
  #   • BlinkTalk-macos.pkg — Mac Catalyst package (App Store distribution)
  #
  # Required secrets:
  #   MAC_CERTIFICATE                  – Base64-encoded Apple Distribution P12 certificate (code signing).
  #   MAC_CERTIFICATE_PASSWORD         – Password for the Apple Distribution P12.
  #   MAC_INSTALLER_CERTIFICATE        – Base64-encoded Mac Installer Distribution P12 certificate (package signing).
  #   MAC_INSTALLER_CERTIFICATE_PASSWORD – Password for the Mac Installer Distribution P12.
  #   MAC_PROVISIONING_PROFILE         – Base64-encoded .provisionprofile file.
  build-macos:
    needs: test
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}
      CERT_B64: ${{ secrets.MAC_CERTIFICATE }}
      CERT_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      INSTALLER_CERT_B64: ${{ secrets.MAC_INSTALLER_CERTIFICATE }}
      INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
      PROFILE_B64: ${{ secrets.MAC_PROVISIONING_PROFILE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install MAUI Mac Catalyst workload
        run: dotnet workload install maui-maccatalyst

      - name: Compute app versions
        run: |
          VERSION_CORE="${VERSION%%-Beta.*}"
          echo "DISPLAY_VERSION=$VERSION_CORE" >> "$GITHUB_ENV"
          IFS='.' read -ra P <<< "$VERSION_CORE"
          echo "VERSION_CODE=$((${P[0]} * 10000 + ${P[1]} * 100 + ${P[2]}))" >> "$GITHUB_ENV"

      - name: Verify signing secrets
        run: |
          MISSING=""
          [ -z "$CERT_B64" ]               && MISSING="$MISSING MAC_CERTIFICATE"
          [ -z "$CERT_PASSWORD" ]          && MISSING="$MISSING MAC_CERTIFICATE_PASSWORD"
          [ -z "$INSTALLER_CERT_B64" ]     && MISSING="$MISSING MAC_INSTALLER_CERTIFICATE"
          [ -z "$INSTALLER_CERT_PASSWORD" ] && MISSING="$MISSING MAC_INSTALLER_CERTIFICATE_PASSWORD"
          [ -z "$PROFILE_B64" ]            && MISSING="$MISSING MAC_PROVISIONING_PROFILE"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secret(s):$MISSING. Without them the package cannot be distributed. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install signing certificates
        run: |
          # Decode Apple Distribution certificate (used for code signing)
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/mac-cert.p12"
          if [ ! -s "$RUNNER_TEMP/mac-cert.p12" ]; then
            echo "::error::Decoded certificate is empty – check the MAC_CERTIFICATE secret is valid base64."
            exit 1
          fi
          # Decode Mac Installer Distribution certificate (used for package signing)
          echo "$INSTALLER_CERT_B64" | base64 --decode > "$RUNNER_TEMP/mac-installer-cert.p12"
          if [ ! -s "$RUNNER_TEMP/mac-installer-cert.p12" ]; then
            echo "::error::Decoded installer certificate is empty – check the MAC_INSTALLER_CERTIFICATE secret is valid base64."
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 30)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/mac-cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12
          security import "$RUNNER_TEMP/mac-installer-cert.p12" -k "$KEYCHAIN_PATH" -P "$INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Preserve the existing user keychain search list rather than replacing it,
          # so macOS tooling that relies on the login keychain keeps working.
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[",]//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Extract the Apple Distribution identity (codesigning) - first match
          CODESIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Apple Distribution" | grep -o '"[^"]*"' | head -1 | tr -d '"')
          # Extract the Mac Installer Distribution identity (packaging)
          INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | grep "Mac Installer Distribution" | grep -o '"[^"]*"' | head -1 | tr -d '"')
          echo "CODESIGN_IDENTITY=$CODESIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        run: |
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.provisionprofile"
          if [ ! -s "$RUNNER_TEMP/profile.provisionprofile" ]; then
            echo "::error::Decoded provisioning profile is empty – check the MAC_PROVISIONING_PROFILE secret is valid base64."
            exit 1
          fi
          UUID=$(grep -a -A 1 '<key>UUID</key>' "$RUNNER_TEMP/profile.provisionprofile" | tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.provisionprofile" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".provisionprofile
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Build macOS package
        run: |
          # TEMPORARY diagnostics (see .github/scripts/monitor-codesign.sh)
          # for investigating the /usr/bin/codesign hang (0% CPU, never
          # returns) on Mac Catalyst Release publishes. Adds a binary log, a
          # diagnostic-verbosity file log, and periodic ps/sample/lsof/
          # ancestor-chain/keychain-state captures of the actual codesign
          # process (matched by exact executable path, not a substring
          # grep), plus a bounded security-focused unified log stream while
          # codesign is observed running.
          DIAG_DIR="$RUNNER_TEMP/diagnostics/macos"
          mkdir -p "$DIAG_DIR"

          set +e
          dotnet publish Source/BlinkTalk/BlinkTalk.csproj \
            -f net10.0-maccatalyst \
            -c Release \
            -p:PublishTargetFramework=net10.0-maccatalyst \
            -p:ApplicationDisplayVersion="$DISPLAY_VERSION" \
            -p:ApplicationVersion="$VERSION_CODE" \
            -p:ApplicationId="com.airsoftwarelimited.blinktalk.app" \
            -p:MtouchEnableSGenConc=true \
            -p:EnableCodeSigning=true \
            -p:EnablePackageSigning=true \
            -p:CodesignKey="$CODESIGN_IDENTITY" \
            -p:CodesignProvision="$PROFILE_UUID" \
            -p:PackageSigningKey="$INSTALLER_IDENTITY" \
            -p:CodesignEntitlements="Platforms/MacCatalyst/Entitlements.plist" \
            -p:ApplicationTeamId="MMC8RNW6ZC" \
            -o publish/macos \
            -bl:"$DIAG_DIR/macos-publish.binlog" \
            "-flp:v=diag;logfile=$DIAG_DIR/macos-publish-diag.log" &
          PUBLISH_PID=$!

          bash "$GITHUB_WORKSPACE/.github/scripts/monitor-codesign.sh" "$DIAG_DIR" "$PUBLISH_PID" "$KEYCHAIN_PATH" 15 &
          MONITOR_PID=$!

          wait "$PUBLISH_PID"
          PUBLISH_EXIT=$?
          set -e

          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true

          exit $PUBLISH_EXIT

      - name: Upload macOS codesign diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-codesign-diagnostics
          path: ${{ runner.temp }}/diagnostics/macos
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and rename package
        run: |
          PKG=$(find publish/macos Source/BlinkTalk/bin/Release/net10.0-maccatalyst -type f -name "*.pkg" | head -1)
          if [ -z "$PKG" ]; then
            echo "::error::No .pkg found after publish."
            exit 1
          fi
          cp "$PKG" "BlinkTalk-macos.pkg"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/mac-cert.p12" "$RUNNER_TEMP/mac-installer-cert.p12" "$RUNNER_TEMP/profile.provisionprofile"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: BlinkTalk-macos.pkg

  # ── 6. Build – iOS ───────────────────────────────────────────────────────
  # Produces:
  #   • BlinkTalk-ios.ipa — iOS app archive
  #
  # Required secrets (the job fails if any are absent — otherwise the IPA is
  # not code-signed and cannot be distributed or submitted to the App Store):
  #   IOS_CERTIFICATE          – Base64-encoded P12 distribution certificate.
  #   IOS_CERTIFICATE_PASSWORD – P12 certificate password.
  #   IOS_PROVISIONING_PROFILE – Base64-encoded .mobileprovision file.
  build-ios:
    needs: test
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}
      CERT_B64: ${{ secrets.IOS_CERTIFICATE }}
      CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Compute app versions
        run: |
          VERSION_CORE="${VERSION%%-Beta.*}"
          echo "DISPLAY_VERSION=$VERSION_CORE" >> "$GITHUB_ENV"
          IFS='.' read -ra P <<< "$VERSION_CORE"
          echo "VERSION_CODE=$((${P[0]} * 10000 + ${P[1]} * 100 + ${P[2]}))" >> "$GITHUB_ENV"

      - name: Verify signing secrets
        run: |
          MISSING=""
          [ -z "$CERT_B64" ]      && MISSING="$MISSING IOS_CERTIFICATE"
          [ -z "$CERT_PASSWORD" ] && MISSING="$MISSING IOS_CERTIFICATE_PASSWORD"
          [ -z "$PROFILE_B64" ]   && MISSING="$MISSING IOS_PROVISIONING_PROFILE"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secret(s):$MISSING. Without them the IPA cannot be distributed. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install signing certificate
        run: |
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          if [ ! -s "$RUNNER_TEMP/cert.p12" ]; then
            echo "::error::Decoded certificate is empty – check the IOS_CERTIFICATE secret is valid base64."
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 30)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Preserve the existing user keychain search list rather than replacing it,
          # so macOS tooling that relies on the login keychain keeps working.
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[",]//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -o '"[^"]*"' | head -1 | tr -d '"')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        run: |
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          if [ ! -s "$RUNNER_TEMP/profile.mobileprovision" ]; then
            echo "::error::Decoded provisioning profile is empty – check the IOS_PROVISIONING_PROFILE secret is valid base64."
            exit 1
          fi
          UUID=$(grep -a -A 1 '<key>UUID</key>' "$RUNNER_TEMP/profile.mobileprovision" | tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Build iOS IPA
        run: |
          # TEMPORARY diagnostics (see .github/scripts/monitor-codesign.sh)
          # for investigating the /usr/bin/codesign hang (0% CPU, never
          # returns) on iOS Release publishes. Adds a binary log, a
          # diagnostic-verbosity file log, and periodic ps/sample/lsof/
          # ancestor-chain/keychain-state captures of the actual codesign
          # process (matched by exact executable path, not a substring
          # grep), plus a bounded security-focused unified log stream while
          # codesign is observed running.
          DIAG_DIR="$RUNNER_TEMP/diagnostics/ios"
          mkdir -p "$DIAG_DIR"

          set +e
          dotnet publish Source/BlinkTalk/BlinkTalk.csproj \
            -f net10.0-ios \
            -c Release \
            -p:PublishTargetFramework=net10.0-ios \
            -p:ApplicationDisplayVersion="$DISPLAY_VERSION" \
            -p:ApplicationVersion="$VERSION_CODE" \
            -p:ApplicationId="com.airsoftwarelimited.blinktalk.app" \
            -p:ApplicationTeamId="MMC8RNW6ZC" \
            -p:CodesignKey="$CODESIGN_IDENTITY" \
            -p:CodesignProvision="$PROFILE_UUID" \
            -p:ArchiveOnBuild=true \
            -o publish/ios \
            -bl:"$DIAG_DIR/ios-publish.binlog" \
            "-flp:v=diag;logfile=$DIAG_DIR/ios-publish-diag.log" &
          PUBLISH_PID=$!

          bash "$GITHUB_WORKSPACE/.github/scripts/monitor-codesign.sh" "$DIAG_DIR" "$PUBLISH_PID" "$KEYCHAIN_PATH" 15 &
          MONITOR_PID=$!

          wait "$PUBLISH_PID"
          PUBLISH_EXIT=$?
          set -e

          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true

          exit $PUBLISH_EXIT

      - name: Upload iOS codesign diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-codesign-diagnostics
          path: ${{ runner.temp }}/diagnostics/ios
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and rename IPA
        run: |
          IPA=$(find publish/ios Source/BlinkTalk/bin/Release/net10.0-ios -type f -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa found after publish."
            exit 1
          fi
          cp "$IPA" "BlinkTalk-ios.ipa"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: BlinkTalk-ios.ipa

  # ── 7. Upload to App Store ─────────────────────────────────────────────────
  upload-to-app-store:
    needs:
      - build-macos
      - build-ios
    # Only publish to the App Store for stable N.N.N releases, not -Beta.N pre-releases.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: ios-artifacts

      - name: Configure App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' '${{ secrets.APPSTORE_PRIVATE_KEY }}' > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Upload iOS app
        run: |
          xcrun altool --upload-app --type ios \
            --file BlinkTalk-ios.ipa \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: Upload macOS app
        run: |
          xcrun altool --upload-app --type macos \
            --file BlinkTalk-macos.pkg \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

  # ── 8. Upload to Google Play ─────────────────────────────────────────────
  upload-to-google-play:
    needs:
      - build-android
    # Only publish to Google Play for stable N.N.N releases, not -Beta.N pre-releases.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-artifacts

      - name: Upload AAB to Google Play production
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.airsoftwarelimited.blinktalk.app
          releaseFiles: BlinkTalk-GooglePlayStore.aab
          tracks: production
          releaseName: BlinkTalk ${{ github.ref_name }}
          status: completed

  # ── 9. Release ────────────────────────────────────────────────────────────
  # Creates a GitHub Release and attaches all build artifacts.
  # Only runs if every preceding job succeeded.
  release:
    needs:
      - build-windows
      - build-android
      - build-macos
      - build-ios
      - upload-to-app-store
      - upload-to-google-play
    # upload-to-app-store and upload-to-google-play are skipped for -Beta.N pre-releases; still allow the release job to run in that case.
    if: |
      always() &&
      needs.build-windows.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-ios.result == 'success' &&
      (needs.upload-to-app-store.result == 'success' || needs.upload-to-app-store.result == 'skipped') &&
      (needs.upload-to-google-play.result == 'success' || needs.upload-to-google-play.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: android-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: macos-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: ios-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BlinkTalk ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            BlinkTalk-windows.msi
            BlinkTalk-android.apk
            BlinkTalk-GooglePlayStore.aab
            BlinkTalk-macos.pkg
            BlinkTalk-ios.ipa
